<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maths Quest">
<meta name="theme-color" content="#7c5cff">
<meta name="format-detection" content="telephone=no">
<title>Maths Quest</title>
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<style>
/* =========================================================
   MATHS QUEST — styles
   ========================================================= */
:root{
  --ink:#2b2d42; --soft:#6b6f85; --card:#fff; --accent:#7c5cff; --accent2:#efeaff;
  --ok:#22a861; --sun:#ffc93c; --shadow:0 6px 0 rgba(43,45,66,.13); --r:24px;
  --font: ui-rounded,"SF Pro Rounded","Nunito","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
}
body.y1{ --accent:#f0507f; --accent2:#ffe6ee; }
body.y3{ --accent:#6c4cf0; --accent2:#eeeaff; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; overflow:hidden; color:var(--ink); font-family:var(--font);
  background:linear-gradient(160deg,#fff4e3 0%,#eaf4ff 100%);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation; -webkit-text-size-adjust:100%; }
button{ font-family:inherit; color:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
input{ font-family:inherit; -webkit-user-select:text; user-select:text; }
#app{ position:fixed; inset:0; }
.screen{ position:absolute; inset:0; display:none; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:max(12px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left)); }
.screen.active{ display:flex; animation:fadeIn .25s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

/* ---------- buttons ---------- */
.btn{ min-width:64px; min-height:64px; border:none; border-radius:var(--r); background:#fff; box-shadow:var(--shadow);
  font-size:24px; font-weight:800; padding:10px 22px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:10px;
  transition:transform .08s, box-shadow .08s, background .2s; }
.btn:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(43,45,66,.13); }
.btn.primary{ background:var(--accent); color:#fff; }
.btn.green{ background:var(--ok); color:#fff; }
.btn.sun{ background:var(--sun); }
.btn[disabled]{ opacity:.4; }
.icon-btn{ width:64px; height:64px; padding:0; font-size:30px; border-radius:20px; flex:0 0 auto; }
.big-btn{ font-size:30px; min-height:84px; padding:12px 34px; border-radius:30px; }
.row{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:center; }

/* ---------- top bar ---------- */
.topbar{ display:flex; align-items:center; gap:12px; min-height:72px; flex:0 0 auto; }
.topbar .title{ flex:1; font-size:clamp(22px,3.4vw,34px); font-weight:900; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pill{ background:#fff; border-radius:999px; padding:8px 18px; font-weight:900; font-size:24px; box-shadow:var(--shadow); min-height:60px; display:inline-flex; align-items:center; gap:8px; }

/* ---------- start screen ---------- */
.logo{ text-align:center; font-size:clamp(44px,8vw,78px); font-weight:900; margin:10px 0 0; letter-spacing:1px;
  background:linear-gradient(90deg,#f0507f,#ff9f1c,#22a861,#4361ee,#6c4cf0); -webkit-background-clip:text; background-clip:text; color:transparent; }
.tagline{ text-align:center; font-size:24px; color:var(--soft); font-weight:700; margin:0 0 20px; }
.profiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:26px; width:100%; max-width:900px; margin:0 auto; flex:1; align-content:center; }
.profile{ border:none; border-radius:36px; padding:28px 18px; color:#fff; box-shadow:0 10px 0 rgba(0,0,0,.15); cursor:pointer; min-height:300px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
.profile:active{ transform:translateY(6px); box-shadow:0 4px 0 rgba(0,0,0,.15); }
.profile .av{ font-size:96px; line-height:1; background:rgba(255,255,255,.25); border-radius:50%; width:150px; height:150px; display:flex; align-items:center; justify-content:center; }
.profile .nm{ font-size:40px; font-weight:900; }
.profile .yr{ font-size:22px; font-weight:800; background:rgba(255,255,255,.25); border-radius:999px; padding:6px 18px; }
.profile .st{ font-size:24px; font-weight:800; }
.start-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; }

/* ---------- home + topic grid ---------- */
.section-title{ font-size:26px; font-weight:900; margin:18px 4px 10px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; }
.tcard{ border:none; border-radius:28px; background:#fff; box-shadow:var(--shadow); min-height:150px; padding:14px 10px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-weight:900; font-size:22px; text-align:center; }
.tcard:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.12); }
.tcard .ic{ font-size:54px; line-height:1.1; }
.tcard .sub{ font-size:17px; font-weight:700; color:var(--soft); }
.tcard.game{ color:#fff; }
.lvlstars{ font-size:18px; letter-spacing:1px; color:#f4a300; }

/* ---------- topic screen ---------- */
.topic-head{ text-align:center; margin:4px 0 8px; }
.topic-head .ic{ font-size:72px; }
.levels{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:16px; max-width:900px; margin:0 auto; width:100%; }
.lvl{ border:none; border-radius:28px; background:#fff; box-shadow:var(--shadow); min-height:130px; padding:12px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:24px; font-weight:900; }
.lvl small{ font-size:16px; font-weight:700; color:var(--soft); }
.lvl.locked{ opacity:.45; }
.lvl.cur{ outline:5px solid var(--accent); }

/* ---------- quiz screen ---------- */
.qwrap{ flex:1; display:flex; flex-direction:column; gap:14px; min-height:0; }
.qcard{ background:#fff; border-radius:30px; box-shadow:var(--shadow); padding:18px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; flex:1 1 auto; min-height:220px; text-align:center; overflow:auto; position:relative; }
.qvisual{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:14px; max-width:100%; }
.qtext{ font-size:clamp(28px,4.4vw,46px); font-weight:900; line-height:1.3; }
.qtext.long{ font-size:clamp(22px,2.9vw,31px); font-weight:800; line-height:1.4; max-width:34em; }
.qanswer{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
@media (orientation:landscape){
  .qwrap{ flex-direction:row; }
  .qcard{ flex:1.35 1 0; }
  .qanswer{ flex:1 1 0; }
}
.slot{ display:inline-block; min-width:1.8em; padding:0 .25em; border-bottom:5px solid var(--accent); color:var(--accent); background:var(--accent2); border-radius:12px 12px 4px 4px; text-align:center; }
.slot:empty::after{ content:'?'; opacity:.45; }
.slotline{ font-size:clamp(30px,4.4vw,46px); font-weight:900; }
.numpad{ display:grid; grid-template-columns:repeat(3,minmax(76px,104px)); gap:12px; }
.numpad .btn{ height:78px; font-size:36px; padding:0; }
.numpad .go{ background:var(--ok); color:#fff; }
.choices{ display:grid; grid-template-columns:repeat(2,minmax(130px,1fr)); gap:14px; width:100%; max-width:680px; }
.choices.three{ grid-template-columns:repeat(3,minmax(110px,1fr)); }
.choices.one{ grid-template-columns:1fr; }
.choices .btn{ min-height:96px; font-size:clamp(22px,3.1vw,34px); padding:8px 12px; line-height:1.2; }
.choices.pics .btn{ min-height:160px; }
.choices .btn small{ display:block; font-size:16px; color:var(--soft); font-weight:700; }
.choices .btn.right{ background:var(--ok); color:#fff; }
.choices .btn.wrong{ background:#e9e9ef; opacity:.55; animation:wobble .4s; }
@keyframes wobble{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
.qtools{ display:flex; justify-content:center; gap:14px; min-height:64px; }
.hintbox{ background:#fff7d6; border-radius:18px; padding:10px 16px; font-size:22px; font-weight:800; max-width:30em; }
.hl{ color:var(--accent); }

/* progress dots / track / timer */
.dots{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.dots i{ width:20px; height:20px; border-radius:50%; background:#dcdce6; display:block; }
.dots i.ok{ background:var(--ok); } .dots i.no{ background:var(--sun); } .dots i.cur{ box-shadow:0 0 0 4px var(--accent); }
.track{ position:relative; height:86px; border-radius:26px; margin:2px 0 4px; overflow:hidden; flex:0 0 auto;
  background:radial-gradient(circle at 20% 30%,#fff 1px,transparent 2px),radial-gradient(circle at 70% 60%,#fff 1px,transparent 2px),linear-gradient(90deg,#1d2b64,#5b3fa8); background-size:60px 40px,90px 50px,100% 100%; }
.track .rk{ position:absolute; top:50%; font-size:52px; transform:translate(-50%,-50%) rotate(45deg); transition:left .7s cubic-bezier(.3,1.4,.5,1); z-index:2; }
.track .moon{ position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:56px; }
.track .sp{ position:absolute; top:50%; transform:translate(-50%,-50%); font-size:26px; opacity:.25; transition:opacity .3s, transform .3s; }
.track .sp.lit{ opacity:1; transform:translate(-50%,-50%) scale(1.25); }
.timerbar{ height:26px; border-radius:14px; background:#e3e3ee; overflow:hidden; flex:1; }
.timerbar i{ display:block; height:100%; background:linear-gradient(90deg,#22a861,#ffc93c); transition:width 1s linear; }
.clockrow{ display:flex; gap:12px; align-items:center; flex:0 0 auto; }

/* bubbles */
.choices.bubbles{ max-width:560px; gap:22px; justify-items:center; }
.choices.bubbles .btn{ width:clamp(130px,19vw,180px); height:clamp(130px,19vw,180px); min-height:0; border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#ffffff 0 10%,#d6f0ff 30%,#9fd6ff 75%,#7cc4ff); box-shadow:inset -8px -10px 18px rgba(0,80,160,.18),0 8px 18px rgba(0,80,160,.18);
  animation:bob 3.2s ease-in-out infinite; }
.choices.bubbles .btn:nth-child(2){ animation-delay:-.8s } .choices.bubbles .btn:nth-child(3){ animation-delay:-1.6s } .choices.bubbles .btn:nth-child(4){ animation-delay:-2.4s }
.choices.bubbles .btn.right{ animation:pop .45s forwards; }
.choices.bubbles .btn.wrong{ animation:wobble .4s; opacity:.4; }
@keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
@keyframes pop{ 0%{transform:scale(1)} 60%{transform:scale(1.3); opacity:.8} 100%{transform:scale(1.6); opacity:0} }

/* feedback sheet + toasts */
.sheet{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:34px 34px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.18); z-index:30;
  padding:20px max(24px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
  transform:translateY(110%); transition:transform .3s ease; max-height:80%; overflow-y:auto; }
.sheet.show{ transform:none; }
.sheet h2{ margin:0 0 6px; font-size:30px; }
.sheet .ans{ font-size:28px; font-weight:900; margin:6px 0 10px; }
ol.steps{ margin:0 0 14px; padding-left:0; list-style:none; counter-reset:s; }
ol.steps li{ counter-increment:s; font-size:22px; font-weight:700; line-height:1.4; margin:8px 0; padding:10px 14px 10px 56px; background:var(--accent2); border-radius:16px; position:relative; }
ol.steps li::before{ content:counter(s); position:absolute; left:12px; top:9px; width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; font-weight:900; display:flex; align-items:center; justify-content:center; font-size:18px; }
.sheet .evis{ display:flex; justify-content:center; margin:6px 0 12px; flex-wrap:wrap; gap:12px; }
.okflash{ position:fixed; left:50%; top:42%; transform:translate(-50%,-50%) scale(.6); z-index:40; background:var(--ok); color:#fff; font-size:44px; font-weight:900;
  border-radius:32px; padding:18px 34px; opacity:0; pointer-events:none; transition:all .2s; text-align:center; }
.okflash.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
.okflash.info{ background:#4361ee; font-size:34px; }
.toast{ position:fixed; left:50%; top:max(18px,env(safe-area-inset-top)); transform:translate(-50%,-140%); z-index:45; background:#2b2d42; color:#fff; font-size:24px; font-weight:800;
  border-radius:22px; padding:14px 24px; transition:transform .3s; pointer-events:none; text-align:center; max-width:90vw; }
.toast.show{ transform:translate(-50%,0); }

/* modal */
.modal{ position:fixed; inset:0; background:rgba(30,30,50,.45); z-index:50; display:none; align-items:center; justify-content:center; padding:20px; }
.modal.show{ display:flex; }
.modal .box{ background:#fff; border-radius:32px; padding:24px; max-width:520px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.25); }
.modal h2{ margin:0 0 10px; font-size:30px; }
.modal p{ font-size:22px; font-weight:700; margin:6px 0 14px; }

/* lesson */
.lesson-card{ background:#fff; border-radius:30px; box-shadow:var(--shadow); padding:22px; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; overflow:auto; }
.lesson-card .lt{ font-size:clamp(24px,3.6vw,36px); font-weight:900; line-height:1.35; max-width:30em; }
.lesson-card .lp{ font-size:clamp(20px,2.8vw,28px); font-weight:700; line-height:1.45; max-width:32em; color:#3d4060; }
.lesson-nav{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:14px; flex:0 0 auto; }

/* result */
.result{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; }
.result .stars{ font-size:clamp(70px,12vw,110px); letter-spacing:6px; }
.result .stars span{ display:inline-block; animation:starIn .5s both; }
.result .stars span:nth-child(2){ animation-delay:.25s } .result .stars span:nth-child(3){ animation-delay:.5s }
.result .stars .off{ filter:grayscale(1); opacity:.3; }
@keyframes starIn{ from{ transform:scale(0) rotate(-90deg); } to{ transform:none; } }
.result h1{ font-size:clamp(34px,6vw,52px); margin:0; }
.result .msg{ font-size:26px; font-weight:800; color:var(--soft); }
.award{ background:#fff; border-radius:26px; box-shadow:var(--shadow); padding:14px 24px; font-size:24px; font-weight:800; display:flex; align-items:center; gap:14px; }
.award .em{ font-size:60px; animation:starIn .6s both .7s; }
.mistakes{ width:100%; max-width:760px; text-align:left; }
.mistake{ background:#fff; border-radius:20px; box-shadow:var(--shadow); margin:10px 0; padding:12px 16px; }
.mistake .mq{ font-size:22px; font-weight:800; display:flex; justify-content:space-between; gap:12px; align-items:center; }
.mistake ol.steps{ display:none; margin-top:10px; }
.mistake.open ol.steps{ display:block; }

/* stickers */
.stickers{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:14px; }
.stk{ aspect-ratio:1; border-radius:26px; background:#fff; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; font-size:60px; }
.stk.no{ background:#eceaf3; color:#c4c2d2; font-size:40px; font-weight:900; box-shadow:none; }

/* parent area */
.pcard{ background:#fff; border-radius:28px; box-shadow:var(--shadow); padding:18px 20px; margin:10px auto 16px; width:100%; max-width:980px; }
.pcard h2{ margin:0 0 10px; font-size:28px; display:flex; align-items:center; gap:10px; }
.pcard .kv{ display:flex; flex-wrap:wrap; gap:10px; margin:8px 0 12px; }
.pcard .kv span{ background:#f2f1f8; border-radius:14px; padding:8px 14px; font-size:19px; font-weight:800; }
.pcard input[type=text]{ font-size:24px; font-weight:800; padding:10px 14px; border-radius:16px; border:3px solid #ddd; min-height:60px; width:260px; max-width:100%; }
table.stats{ width:100%; border-collapse:collapse; font-size:18px; }
table.stats th{ text-align:left; color:var(--soft); font-size:15px; padding:6px; }
table.stats td{ padding:8px 6px; border-top:1px solid #eee; font-weight:700; }
.bar{ height:14px; background:#eee; border-radius:8px; overflow:hidden; min-width:80px; }
.bar i{ display:block; height:100%; border-radius:8px; }
.weak{ color:#d1495b; font-weight:900; }
.seg{ display:inline-flex; border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
.seg button{ border:none; min-height:60px; min-width:96px; font-size:20px; font-weight:800; background:#fff; }
.seg button.on{ background:var(--accent); color:#fff; }
.note{ font-size:17px; color:var(--soft); font-weight:700; }

/* ---------- maths visuals ---------- */
.vis{ max-width:100%; height:auto; }
.vis text{ font-family:var(--font); }
.objs{ display:flex; flex-direction:column; gap:6px; align-items:center; }
.orow{ display:flex; gap:6px; }
.obj{ font-size:clamp(32px,4.8vw,48px); line-height:1.05; position:relative; }
.obj.gone{ opacity:.4; }
.obj.gone::after{ content:''; position:absolute; left:-4px; right:-4px; top:48%; height:6px; background:#e63946; transform:rotate(-35deg); border-radius:3px; }
.plus{ font-size:46px; font-weight:900; }
.blocks{ display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; justify-content:center; }
.bgrp{ display:flex; flex-wrap:wrap; gap:4px; align-items:flex-end; max-width:300px; justify-content:center; }
.col{ font-size:clamp(34px,5vw,50px); font-weight:900; border-collapse:collapse; font-variant-numeric:tabular-nums; margin:0 auto; }
.col td{ width:1.15em; text-align:center; padding:0 4px; }
.col tr.h td{ font-size:.42em; color:var(--soft); }
.col tr.ans td{ border-top:5px solid var(--ink); color:var(--accent); }
.frac{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.05; margin:0 .1em; font-size:.95em; }
.frac .fn{ border-bottom:.09em solid currentColor; padding:0 .15em .02em; }
.frac .fd{ padding:.02em .15em 0; }
.groups{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
.groups .g{ border:4px dashed #b9b6d3; border-radius:22px; padding:8px 10px; display:flex; flex-wrap:wrap; gap:4px; max-width:170px; justify-content:center; }
.roman{ font-size:84px; font-weight:900; font-family:Georgia,"Times New Roman",serif; letter-spacing:4px; }
.chip{ display:inline-block; background:var(--accent2); border-radius:12px; padding:2px 10px; margin:2px; }

@media (orientation:portrait) and (min-width:700px){
  .lesson-card > :not(.lt):not(.lp){ zoom:1.3; }
  .qvisual{ zoom:1.15; }
}
.confetti i{ position:fixed; top:-30px; width:14px; height:20px; z-index:60; border-radius:3px; animation:fall linear forwards; pointer-events:none; }
@keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); } }
</style>
</head>
<body class="y3">
<div id="app">

  <!-- START: choose player -->
  <section class="screen active" id="scr-start">
    <div class="topbar"><div style="width:64px"></div><div class="title"></div><button class="btn icon-btn mute" data-act="mute" aria-label="Sound on or off">🔊</button></div>
    <div class="logo">Maths Quest</div>
    <p class="tagline">Who is playing today?</p>
    <div class="profiles" id="profiles"></div>
    <div class="start-foot">
      <button class="btn" data-act="gate" aria-label="Grown-ups area">🔒 Grown-ups</button>
      <span class="note" id="storeNote"></span>
    </div>
  </section>

  <!-- HOME: a child's hub -->
  <section class="screen" id="scr-home">
    <div class="topbar">
      <button class="btn icon-btn" data-act="toStart" aria-label="Change player">👥</button>
      <div class="title" id="homeTitle"></div>
      <span class="pill" id="homeStars">⭐ 0</span>
      <button class="btn icon-btn" data-act="stickers" aria-label="Sticker book">📒</button>
      <button class="btn icon-btn mute" data-act="mute" aria-label="Sound on or off">🔊</button>
    </div>
    <div id="homeBody"></div>
  </section>

  <!-- TOPIC: levels + learn + games for one topic -->
  <section class="screen" id="scr-topic">
    <div class="topbar">
      <button class="btn icon-btn" data-act="toHome" aria-label="Back">⬅️</button>
      <div class="title" id="topicTitle"></div>
      <button class="btn icon-btn mute" data-act="mute" aria-label="Sound on or off">🔊</button>
    </div>
    <div id="topicBody"></div>
  </section>

  <!-- LESSON: visual explanation slides -->
  <section class="screen" id="scr-lesson">
    <div class="topbar">
      <button class="btn icon-btn" data-act="toTopic" aria-label="Back">⬅️</button>
      <div class="title" id="lessonTitle"></div>
      <button class="btn icon-btn" data-act="sayLesson" aria-label="Read aloud">🔈</button>
    </div>
    <div class="lesson-card" id="lessonCard"></div>

function timeWords(h, m) {

function countSteps(n) {
  const full = Math.floor(n / 5), rest = n % 5, s = ['Touch each one as you count it.'];
  if (full >= 1) {
    const fives = []; for (let i = 1; i <= full; i++) fives.push(i * 5);
    let line = `Count the full rows in 5s: ${list(fives)}.`;
    if (rest) { const on = []; for (let i = 1; i <= rest; i++) on.push(full * 5 + i); line += ` Then count on: ${list(on)}.`; }
    s.push(line);
  }
  s.push(`There are ${n}.`); return s;
}
function cmpSteps(a, b) {
  if (a === b) return [`${a} and ${b} are the same number.`, `So ${a} is equal to ${b}.`];
  const ta = Math.floor(a / 10), tb = Math.floor(b / 10), big = Math.max(a, b), small = Math.min(a, b);
  if (ta !== tb) return [`Look at the tens first: ${a} has ${ta} ${s_(ta, 'ten')}, ${b} has ${tb} ${s_(tb, 'ten')}.`, `${big} has more tens, so ${big} is more.`, `${small} is less than ${big}.`];
  return [`They both have ${ta} ${s_(ta, 'ten')}, so look at the ones: ${a % 10} and ${b % 10}.`, `${big} has more ones, so ${big} is more.`, `${small} is less than ${big}.`];
}

const digits3 = n => String(n).padStart(3, '0').split('').map(Number);
const PLACE = ['hundreds', 'tens', 'ones'];

/* Column addition worked steps */
function colAddSteps(a, b) {
  const A = digits3(a), B = digits3(b), names = ['ones', 'tens', 'hundreds'], steps = []; let carry = 0;
  for (let i = 0; i < 3; i++) {
    const x = A[2 - i], y = B[2 - i]; if (i === 2 && x === 0 && y === 0 && !carry) break;
    const s = x + y + carry, cs = carry ? ` + 1 (carried)` : '';
    if (s >= 10 && i < 2) { steps.push(`${cap(names[i])}: ${x} + ${y}${cs} = ${s}. Write ${s % 10} and carry 1 to the ${names[i + 1]}.`); carry = 1; }
    else { steps.push(`${cap(names[i])}: ${x} + ${y}${cs} = ${s}.`); carry = 0; }
  }
  steps.push(`So ${a} + ${b} = ${a + b}.`); return steps;
}
/* Column subtraction worked steps, with exchanging */
function colSubSteps(a, b) {
  const T = digits3(a), B = digits3(b), names = ['hundreds', 'tens', 'ones'], steps = [], changed = [false, false, false];
  for (let c = 2; c >= 0; c--) {
    if (c === 0 && T[0] === 0 && B[0] === 0) break;
    if (T[c] < B[c]) {
      if (T[c - 1] > 0) {
        T[c - 1]--; changed[c - 1] = true; T[c] += 10;
        steps.push(`${cap(names[c])}: ${T[c] - 10} is smaller than ${B[c]}, so exchange 1 ${names[c - 1].slice(0, -1)} for 10 ${names[c]}. Now ${T[c]} ${MINUS} ${B[c]} = ${T[c] - B[c]}.`);
      } else { // ones need an exchange but there are no tens: exchange a hundred first
        T[0]--; changed[0] = true; T[1] += 9; changed[1] = true; T[2] += 10;
        steps.push(`Ones: ${T[2] - 10} is smaller than ${B[2]} and there are no tens. Exchange 1 hundred for 10 tens, then 1 ten for 10 ones. Now ${T[2]} ${MINUS} ${B[2]} = ${T[2] - B[2]}.`);
      }
    } else steps.push(`${cap(names[c])}: ${T[c]} ${MINUS} ${B[c]} = ${T[c] - B[c]}${changed[c] ? ' (after the exchange)' : ''}.`);
  }
  steps.push(`So ${a} ${MINUS} ${b} = ${a - b}.`); return steps;
}

const hasCarry = (a, b) => { const A = digits3(a), B = digits3(b); return A[2] + B[2] >= 10 || A[1] + B[1] >= 10; };

  if (t === 5) s.push(`Tip: ${b} × 5 is half of ${b} × 10 = ${b * 10}.`);
  return s;
}

function romanSteps(n) {

function wpQ(p, tag) { return numQ({ text: p.text, answer: p.answer, post: p.post || '', hint: 'Find the numbers. Look for clue words like "altogether", "left" or "each".', steps: p.steps, sig: tag + p.text }); }

/* =========================================================
   6. Storage, sound, speech
   ========================================================= */
const Store = {
  ok: true, mem: {},
  init() { try { const k = '__mq_test'; localStorage.setItem(k, '1'); localStorage.removeItem(k); } catch (e) { this.ok = false; } },
  get(k, d) { if (k in this.mem) return this.mem[k]; try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { this.ok = false; return d; } },
  set(k, v) { this.mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { this.ok = false; } },
  del(k) { delete this.mem[k]; try { localStorage.removeItem(k); } catch (e) { } }
};

const Sound = {
  ctx: null,
  init() {
    try { if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { }
  },
  tone(f, t, d, type = 'sine', v = .16) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + t;
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + d + .05);
  },
  play(name) {
    if (settings.muted || !this.ctx) return;
    try {
      if (name === 'tap') this.tone(700, 0, .07, 'triangle', .07);
      else if (name === 'ok') { this.tone(660, 0, .14); this.tone(990, .1, .22); }
      else if (name === 'think') { this.tone(440, 0, .16, 'triangle', .08); this.tone(494, .13, .2, 'triangle', .07); } // soft, friendly "hmm"
      else if (name === 'pop') { this.tone(900, 0, .08, 'square', .05); this.tone(1400, .04, .1, 'sine', .08); }
      else if (name === 'level') [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .09, .22));
      else if (name === 'win') [523, 659, 784, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .12, .3, 'triangle', .14));
    } catch (e) { }
  }
};

const Speech = {
  ok: typeof window !== 'undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined', voice: null,
  pick() {
    if (!this.ok) return; const vs = speechSynthesis.getVoices() || [];
    const gb = vs.filter(v => /en[-_]GB/i.test(v.lang));
    this.voice = gb.find(v => /Serena|Kate|Martha|Stephanie|Daniel|Arthur/i.test(v.name)) || gb[0] || vs.find(v => /^en/i.test(v.lang)) || null;
  },
  say(text) {
    if (!this.ok || !text) return;
    try {
      speechSynthesis.cancel(); if (!this.voice) this.pick();
      const u = new SpeechSynthesisUtterance(text); if (this.voice) u.voice = this.voice;
      u.lang = 'en-GB'; u.rate = App.year === 1 ? .85 : .95; u.pitch = 1.05; speechSynthesis.speak(u);
    } catch (e) { }
  },
  stop() { try { if (this.ok) speechSynthesis.cancel(); } catch (e) { } }
};
/* Turn on-screen maths into words for read-aloud. */
function toSpeech(htmlOrText) {
  let t = String(htmlOrText || '');
  if (typeof document !== 'undefined') {
    const d = document.createElement('div'); d.innerHTML = t.split(SLOT).join('<span class="slot"></span>');
    d.querySelectorAll('.frac').forEach(f => f.replaceWith(' ' + f.dataset.say + ' '));
    d.querySelectorAll('.slot').forEach(f => f.replaceWith(' what '));
    d.querySelectorAll('br').forEach(f => f.replaceWith('. '));
    t = d.textContent;
  }
  const UW = { p: 'pence', cm: 'centimetres', mm: 'millimetres', ml: 'millilitres', g: 'grams', kg: 'kilograms', m: 'metres', l: 'litres' };
  t = t.replace(/\bwhat\s?(p|cm|mm|ml|kg|g|m|l)\b/g, (m, u) => 'what ' + UW[u]);
  t = t.replace(/ < /g, ' is less than ').replace(/ > /g, ' is greater than ').replace(/a £(\d+) note/g, 'a $1 pound note');
  return t.replace(/£(\d+) and (\d+)p/g, (m, a, b) => `${a} ${a === '1' ? 'pound' : 'pounds'} and ${b} pence`)
    .replace(/£(\d+)/g, (m, a) => `${a} ${a === '1' ? 'pound' : 'pounds'}`)
    .replace(/(\d+)\s?p\b/g, (m, a) => a === '1' ? '1 penny' : `${a} pence`)
    .replace(/(\d+)\s?mm\b/g, '$1 millimetres').replace(/(\d+)\s?cm\b/g, '$1 centimetres').replace(/(\d+)\s?ml\b/g, '$1 millilitres')
    .replace(/(\d+)\s?kg\b/g, '$1 kilograms').replace(/(\d+)\s?g\b/g, '$1 grams').replace(/(\d+)\s?m\b/g, '$1 metres').replace(/(\d+)\s?l\b/g, '$1 litres')
    .replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/−/g, ' take away ').replace(/\+/g, ' add ').replace(/=/g, ' equals ')
    .replace(/[✓✔️➡️⬅️]/g, '').replace(/\s+/g, ' ').trim();
}

/* Question text without HTML, keeping maths symbols (for the grown-ups' mistake list). */
function plainText(html) {
  const d = document.createElement('div'); d.innerHTML = String(html).split(SLOT).join(' ? ');
  d.querySelectorAll('.frac').forEach(f => f.replaceWith(f.querySelector('.fn').textContent + '/' + f.querySelector('.fd').textContent));
  d.querySelectorAll('br').forEach(f => f.replaceWith(' '));
  return d.textContent.replace(/\s+/g, ' ').trim();
}

/* =========================================================
   7. Game engine
   ========================================================= */
const STICKERS = ['🦄', '🐶', '🐱', '🐼', '🦊', '🐸', '🐙', '🦋', '🐢', '🦖', '🐳', '🦁', '🐨', '🐧', '🦉', '🐝', '🌈', '🌻', '🍉', '🍩', '🧁', '🍓', '🚀', '🛸', '🎈', '🎨', '🏰', '⚽', '🎸', '👑', '💎', '🌟', '🍀', '🐬', '🦩', '🐞', '🦔', '🐹', '🐰', '🌙'];
const PRAISE = { 1: ['Yes! 🎉', 'Super! ⭐', 'Well done! 🌟', 'Brilliant! 🎈', 'You did it! 🙌'], 3: ['Brilliant!', 'Spot on!', 'Fantastic!', 'Great thinking!', 'Well done!', 'Super maths!', 'Nailed it!'] };
const ENCOURAGE = { 1: ["Let's see how 💡", 'Good try! Look 👀', "Let's work it out 💡"], 3: ["Good try — let's see how.", "Nearly! Here's how it works.", "Let's work it out together.", 'Mistakes help us learn!'] };
const DEFAULT_PROFILES = [
  { id: 'p1', name: 'Tze Ching', year: 3, avatar: '🦄', colour: '#6c4cf0' },
  { id: 'p2', name: 'Yui Hei', year: 1, avatar: '🐣', colour: '#f0507f' }
];
let settings = { profiles: DEFAULT_PROFILES.map(p => Object.assign({}, p)), muted: false, autoRead: { p1: false, p2: true } };
const App = { pid: null, prog: null, year: 3, recent: [], lastTouch: Date.now(), topicId: null };
let S = null; // the current session (round)

function topicsFor(year) { return TOPICS[year] || []; }
function topicById(id) { return TOPICS[1].concat(TOPICS[3]).find(t => t.id === id); }
function profile(id) { return settings.profiles.find(p => p.id === (id || App.pid)); }
function newProg() { return { stars: 0, stickers: [], topics: {}, review: [], seen: 0, time: 0, best: { clock: 0 }, wrongLog: [], nextMilestone: 20 }; }
function loadProg(id) { const p = Store.get('mq.prog.' + id, null); const base = newProg(); return p ? Object.assign(base, p) : base; }
function saveProg() { if (App.pid && App.prog) Store.set('mq.prog.' + App.pid, App.prog); }
function saveSettings() { Store.set('mq.settings', settings); }
function tstat(tid) { const T = App.prog.topics; if (!T[tid]) T[tid] = { level: 1, max: 1, att: 0, ok: 0, done: {} }; return T[tid]; }
const roundSize = () => App.year === 1 ? 5 : 10;

/* Make one question for a topic at a level, avoiding recent repeats. */
function makeQuestion(tid, lvl) {
  const T = topicById(tid), L = T.levels[Math.min(lvl, T.levels.length) - 1]; let q;
  for (let i = 0; i < 15; i++) { q = L.gen(); if (!App.recent.includes(q.sig)) break; }
  q.tid = tid; q.lvl = lvl; App.recent.push(q.sig); if (App.recent.length > 40) App.recent.shift();
  return q;
}
function cloneQ(q) { const c = JSON.parse(JSON.stringify(q)); if (c.kind === 'choice' && !c.keepOrder) c.choices = shuffle(c.choices); return c; }

/* Start a round. mode: learn | practice | rocket | bubble | clock | review */
function startSession(mode, tids, startLevel) {
  const lv = {}; tids.forEach(t => { const st = tstat(t); lv[t] = startLevel || Math.min(st.level, st.max); });
  S = { mode, tids, level: lv, startLevel: startLevel || null, total: mode === 'clock' ? Infinity : roundSize(), idx: 0, results: [], streak: 0, wrongRun: 0, q: null, tries: 0, locked: false, timeLeft: 60, timer: null, reviewList: null };
  if (mode === 'review') { S.reviewList = shuffle(App.prog.review.filter(r => topicById(r.q.tid) && topicsFor(App.year).includes(topicById(r.q.tid)))).slice(0, roundSize()); S.total = S.reviewList.length; }
  if (mode === 'clock') S.timer = setInterval(clockTick, 1000);
  show('quiz'); nextQuestion();
}
function nextQuestion() {
  hideSheet();
  if (S.idx >= S.total) return endSession();
  let q = null;
  if (S.mode === 'review') { q = cloneQ(S.reviewList[S.idx].q); q.fromReview = true; }
  else {
    const due = App.prog.review.filter(r => S.tids.includes(r.q.tid) && r.due <= App.prog.seen);
    if (due.length && chance(.45)) { q = cloneQ(pick(due).q); q.fromReview = true; }
    else { const tid = pick(S.tids); q = makeQuestion(tid, S.level[tid]); }
  }
  if (S.mode === 'bubble') q = toChoiceQ(q);
  S.q = q; S.tries = 0; S.input = ''; S.locked = false; S.hintShown = false;
  renderQuestion();
}
function checkAnswer(q, given) { return q.kind === 'num' ? given !== '' && Number(given) === q.answer : String(given) === q.answer; }

function submit(given, btn) {
  if (!S || S.locked) return;
  const q = S.q, ok = checkAnswer(q, given), first = S.tries === 0; S.tries++;
  if (first) { recordAttempt(q, ok); S.results.push({ q, ok }); }
  if (ok) {
    S.locked = true; S.streak++; S.wrongRun = 0;
    if (q.fromReview && first) reviewHit(q);
    if (btn) btn.classList.add('right');
    if (q.kind === 'num') { const sl = document.getElementById('slot'); if (sl) sl.textContent = given; }
    Sound.play(S.mode === 'bubble' ? 'pop' : 'ok');
    updateTop(true);
    const levelled = adapt(true);
    if (S.mode === 'clock') { flash('✓', 380); setTimeout(() => { S.idx++; nextQuestion(); }, 420); return; }
    flash(pick(PRAISE[App.year]), 800);
    setTimeout(() => { S.idx++; nextQuestion(); }, levelled ? 1300 : 950);
  } else {
    S.streak = 0; S.wrongRun++; addReview(q); adapt(false); Sound.play('think');
    if (S.mode === 'clock') { S.locked = true; flash(`${answerText(q)}`, 1200, true); setTimeout(() => { S.idx++; nextQuestion(); }, 1300); return; }
    if (S.mode === 'bubble' && S.tries < 2 && btn) { btn.classList.add('wrong'); btn.disabled = true; toast(App.year === 1 ? 'Try another bubble! 🫧' : 'Not that one — try another bubble!'); return; }
    S.locked = true; if (btn) btn.classList.add('wrong');
    updateTop(false); showExplain(q);
  }
}
/* Adaptive difficulty: 3 right in a row → harder level; 2 wrong in a row → easier level. */
function adapt(ok) {
  const tid = S.q.tid, T = topicById(tid); if (!T || S.mode === 'review') return false;
  let L = S.level[tid], st = tstat(tid), changed = false;
  if (ok && S.streak >= 3 && L < T.levels.length) { S.level[tid] = L + 1; S.streak = 0; st.max = Math.max(st.max, L + 1); changed = true; Sound.play('level'); toast(App.year === 1 ? '⬆️ Level up!' : `⬆️ Level up! ${T.name}: level ${L + 1}`); }
  if (!ok && S.wrongRun >= 2 && L > 1) { S.level[tid] = L - 1; S.wrongRun = 0; changed = true; toast(App.year === 1 ? "Let's try some easier ones 🙂" : "Let's practise an easier level for a bit 🙂"); }
  st.level = S.level[tid]; saveProg(); return changed;
}
function recordAttempt(q, ok) {
  const st = tstat(q.tid); st.att++; if (ok) st.ok++; App.prog.seen++;
  if (!ok) { App.prog.wrongLog.unshift({ t: Date.now(), tid: q.tid, q: plainText(q.text).slice(0, 120), a: answerText(q) }); App.prog.wrongLog = App.prog.wrongLog.slice(0, 30); }
  saveProg();
}
/* Spaced repetition: missed questions come back after 3, then 8, then 20 more questions. */
const GAPS = [3, 8, 20];
function addReview(q) {
  const R = App.prog.review, r = R.find(x => x.q.sig === q.sig && x.q.tid === q.tid);
  if (r) { r.box = 0; r.due = App.prog.seen + GAPS[0]; }
  else { const c = JSON.parse(JSON.stringify(q)); delete c.fromReview; R.push({ q: c, box: 0, due: App.prog.seen + GAPS[0] }); if (R.length > 40) R.shift(); }
  saveProg();
}
function reviewHit(q) {
  const R = App.prog.review, i = R.findIndex(x => x.q.sig === q.sig && x.q.tid === q.tid); if (i < 0) return;
  const r = R[i]; r.box++; if (r.box >= GAPS.length) R.splice(i, 1); else r.due = App.prog.seen + GAPS[r.box];
  saveProg();
}
function answerText(q) {
  if (q.kind === 'num') return (q.pre || '') + q.answer + (q.post || '');
  const c = q.choices.find(x => x.key === q.answer); return c ? (c.say || c.key) : q.answer;
}
function clockTick() {
  if (!S || S.mode !== 'clock') return;
  S.timeLeft--; const bar = document.getElementById('tbar'), lbl = document.getElementById('tleft');
  if (bar) bar.style.width = (S.timeLeft / 60 * 100) + '%'; if (lbl) lbl.textContent = S.timeLeft + 's';
  if (S.timeLeft <= 0) { clearInterval(S.timer); S.timer = null; endSession(); }
}
function stopSession() { if (S && S.timer) clearInterval(S.timer); hideSheet(); Speech.stop(); }

function awardSticker() {
  const left = STICKERS.filter(s => !App.prog.stickers.includes(s)); if (!left.length) return null;
  const s = pick(left); App.prog.stickers.push(s); return s;
}
function endSession() {
  stopSession();
  const mode = S.mode, n = S.results.length, okN = S.results.filter(r => r.ok).length, acc = n ? okN / n : 0;
  let stars = 0, extra = [];
  if (mode === 'clock') { const t = App.year === 1 ? [8, 5] : [14, 9]; stars = n ? (okN >= t[0] ? 3 : okN >= t[1] ? 2 : 1) : 0; if (okN > (App.prog.best.clock || 0)) { App.prog.best.clock = okN; if (okN > 0) extra.push({ em: '🏆', txt: `New best: ${okN} right!` }); } }
  else stars = n ? (acc >= .9 ? 3 : acc >= .7 ? 2 : 1) : 0;
  App.prog.stars += stars;
  // finishing a level in one topic
  if (S.tids.length === 1 && mode !== 'review' && mode !== 'clock' && n >= roundSize()) {
    const tid = S.tids[0], st = tstat(tid), L = S.startLevel || S.level[tid], T = topicById(tid), firstTime = !st.done[L];
    st.done[L] = Math.max(st.done[L] || 0, stars);
    if (acc >= .7) { st.max = Math.min(T.levels.length, Math.max(st.max, L + 1)); if (firstTime) { const s = awardSticker(); if (s) extra.push({ em: s, txt: `New sticker for finishing ${T.name} level ${L}!` }); } }
  }
  while (App.prog.stars >= (App.prog.nextMilestone || 20)) { App.prog.nextMilestone = (App.prog.nextMilestone || 20) + 20; const s = awardSticker(); if (s) extra.push({ em: s, txt: `Bonus sticker for collecting ${App.prog.nextMilestone - 20} stars!` }); }
  saveProg();
  renderResult({ mode, n, okN, stars, extra, wrong: S.results.filter(r => !r.ok).map(r => r.q) });
  if (stars >= 2) { Sound.play('win'); confetti(); } else Sound.play('ok');
}

function renderTopic(tid) {
  App.topicId = tid; const T = topicById(tid), st = tstat(tid), y1 = App.year === 1;
  $('topicTitle').textContent = `${T.icon} ${T.name}`;
  let h = `<div class="row" style="margin:6px 0 16px"><button class="btn big-btn primary" data-act="learn" data-arg="${tid}">💡 ${y1 ? 'Learn' : 'Learn it first'}</button></div>`;
  h += `<div class="section-title" style="text-align:center">${y1 ? 'Levels' : 'Practise a level'}</div><div class="levels">`;
  h += T.levels.map((L, i) => {
    const n = i + 1, locked = n > st.max, stars = st.done[n] || 0;
    return `<button class="lvl${locked ? ' locked' : ''}${n === st.level && !locked ? ' cur' : ''}" data-act="${locked ? 'locked' : 'practise'}" data-arg="${tid}|${n}">${locked ? '🔒' : ''} Level ${n}<small>${L.name}</small><span class="lvlstars">${starStr(stars)}</span></button>`;
  }).join('') + '</div>';
  h += `<div class="section-title" style="text-align:center">${y1 ? 'Play' : 'Play games with this topic'}</div><div class="row">`;
  h += GAMES.map(g => `<button class="btn big-btn" style="background:${g.bg};color:#fff" data-act="game" data-arg="${g.id}|${tid}">${g.icon} ${g.short}</button>`).join('') + '</div>';
  $('topicBody').innerHTML = h; show('topic');
}

/* ---- lesson ---- */
let lessonSlides = [], lessonIdx = 0;
function startLesson(tid) { App.topicId = tid; const T = topicById(tid); lessonSlides = T.lesson(); lessonIdx = 0; $('lessonTitle').textContent = `${T.icon} ${T.name}`; show('lesson'); renderSlide(); }
function renderSlide() {
  const sl = lessonSlides[lessonIdx]; $('lessonCard').innerHTML = sl.html;
  $('lessonDots').innerHTML = lessonSlides.map((_, i) => `<i class="${i === lessonIdx ? 'cur' : i < lessonIdx ? 'ok' : ''}"></i>`).join('');
  $('lessonPrev').style.visibility = lessonIdx ? 'visible' : 'hidden';
  $('lessonNext').textContent = lessonIdx === lessonSlides.length - 1 ? (App.year === 1 ? "Let's go! ➡️" : "Let's practise! ➡️") : 'Next ➡️';
  if (settings.autoRead[App.pid]) Speech.say(sl.say);
}

/* ---- question ---- */
function renderQuestion() {
  const q = S.q, y1 = App.year === 1, modeName = { learn: '💡 Learn', practice: '✏️ Practise', review: y1 ? '🔁 Try again' : '🔁 Tricky ones', rocket: '🚀 Rocket', bubble: '🫧 Bubble Pop', clock: '⏱️ Beat the Clock' }[S.mode];
  const T = topicById(q.tid);
  $('quizTitle').textContent = S.tids.length === 1 && S.mode !== 'review' ? `${T.icon} ${T.name}` : modeName;
  renderTop();
  $('qVisual').innerHTML = q.visual || ''; $('qVisual').style.display = q.visual ? '' : 'none';
  let text = q.text.split(SLOT).join('<span class="slot" id="slot"></span>');
  if (q.kind === 'num' && !q.text.includes(SLOT)) text += `<div class="slotline">${q.pre || ''}<span class="slot" id="slot"></span>${q.post || ''}</div>`;
  $('qText').innerHTML = text; $('qText').classList.toggle('long', toSpeech(q.text).length > 46);
  $('qHint').innerHTML = '';
  // answer area
  if (q.kind === 'num') {
    $('qAnswer').innerHTML = `<div class="numpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="btn" data-act="key" data-arg="${n}">${n}</button>`).join('')}<button class="btn" data-act="key" data-arg="del" aria-label="Delete">⌫</button><button class="btn" data-act="key" data-arg="0">0</button><button class="btn go" data-act="key" data-arg="go" aria-label="Check" id="goBtn" disabled>✓</button></div>`;
  } else {
    const n = q.choices.length, cls = ['choices', q.pics ? 'pics' : '', S.mode === 'bubble' ? 'bubbles' : '', n === 3 && !q.pics && S.mode !== 'bubble' && q.choices.every(c => (c.say || '').length < 14) ? 'three' : '', n === 3 && q.pics && S.mode !== 'bubble' ? 'three' : ''].join(' ');
    $('qAnswer').innerHTML = `<div class="${cls}">${q.choices.map(c => `<button class="btn" data-act="choose" data-arg="${esc(c.key)}">${c.html}</button>`).join('')}</div>`;
  }
  const tools = [];
  if (S.mode !== 'clock') tools.push(`<button class="btn" data-act="hint">💡 ${y1 ? 'Help' : 'Hint'}</button>`);
  $('qTools').innerHTML = tools.join('');
  if (settings.autoRead[App.pid]) setTimeout(() => sayQuestion(), 250);
}
function renderTop() {
  let h = '';
  if (S.mode === 'clock') h = `<div class="clockrow"><span class="pill">✅ <span id="score">${S.results.filter(r => r.ok).length}</span></span><div class="timerbar"><i id="tbar" style="width:${S.timeLeft / 60 * 100}%"></i></div><span class="pill" id="tleft">${S.timeLeft}s</span></div>`;
  else if (S.mode === 'rocket') {
    const pos = 6 + (S.idx / S.total) * 80; let sp = '';
    for (let i = 0; i < S.total; i++) sp += `<span class="sp${S.results[i] && S.results[i].ok ? ' lit' : ''}" style="left:${6 + ((i + 1) / S.total) * 80}%">⭐</span>`;
    h = `<div class="track">${sp}<span class="rk" id="rk" style="left:${pos}%">🚀</span><span class="moon">🌕</span></div>`;
  } else h = `<div class="dots" style="margin:4px 0 10px">${Array.from({ length: S.total }, (_, i) => `<i class="${S.results[i] ? (S.results[i].ok ? 'ok' : 'no') : (i === S.idx ? 'cur' : '')}"></i>`).join('')}</div>`;
  $('quizTop').innerHTML = h;
}
function updateTop(ok) {
  if (S.mode === 'clock') { const s = $('score'); if (s) s.textContent = S.results.filter(r => r.ok).length; return; }
  if (S.mode === 'rocket') { renderTop(); const rk = $('rk'); requestAnimationFrame(() => { if (rk) rk.style.left = (6 + ((S.idx + 1) / S.total) * 80) + '%'; }); return; }
  renderTop();
}
function sayQuestion() {
  const q = S.q; let t = q.say || toSpeech(q.text);
  if (q.kind === 'num' && !q.text.includes(SLOT) && q.post && !q.say) t += '';
  if (q.kind === 'choice' && App.year === 1 && q.choices.every(c => c.say)) t += ' ' + q.choices.map(c => c.say).join(', or ') + '?';
  Speech.say(t);
}
function showHint() {
  if (!S || !S.q) return; S.hintShown = true;
  $('qHint').innerHTML = `<div class="hintbox">💡 ${S.q.hint || 'Take your time and have a go!'}</div>`;
  if (settings.autoRead[App.pid]) Speech.say(toSpeech(S.q.hint));
}
function pressKey(k) {
  if (!S || S.locked) return;
  if (k === 'go') { if (S.input !== '') submit(S.input); return; }
  if (k === 'del') S.input = S.input.slice(0, -1); else if (S.input.length < 4) S.input = (S.input === '0' ? '' : S.input) + k;
  const sl = $('slot'); if (sl) sl.textContent = S.input; const g = $('goBtn'); if (g) g.disabled = S.input === '';
}
function showExplain(q) {
  const y1 = App.year === 1;
  const steps = (q.steps || []).map(s => `<li>${s}</li>`).join('');
  $('sheet').innerHTML = `<h2>${pick(ENCOURAGE[App.year])}</h2><div class="ans">${y1 ? 'The answer is' : 'The answer is'} <span class="hl">${q.kind === 'num' ? (q.pre || '') + q.answer + (q.post || '') : (q.choices.find(c => c.key === q.answer) || {}).html || q.answer}</span></div>
    ${q.evis ? `<div class="evis">${q.evis}</div>` : ''}<ol class="steps">${steps}</ol>
    <div class="row"><button class="btn" data-act="sayExplain">🔈 ${y1 ? 'Listen' : 'Read it to me'}</button><button class="btn big-btn green" data-act="nextQ">${y1 ? 'OK ➡️' : 'Got it ➡️'}</button></div>`;
  $('sheet').classList.add('show'); $('sheet').scrollTop = 0;
  if (settings.autoRead[App.pid]) setTimeout(sayExplain, 300);
}
function sayExplain() { const q = S.q; Speech.say(`The answer is ${answerText(q)}. ` + (q.steps || []).map(toSpeech).join('. ')); }

/* ---- result ---- */
let lastRound = null;
function renderResult(r) {
  const y1 = App.year === 1, titles = ['Good effort!', 'Well done!', 'Great work!', 'Superstar!'];
  let h = `<div class="stars">${[1, 2, 3].map(i => `<span class="${i <= r.stars ? '' : 'off'}">⭐</span>`).join('')}</div>`;
  h += `<h1>${titles[r.stars]}</h1>`;
  h += `<div class="msg">${r.mode === 'clock' ? `You got ${r.okN} right in 60 seconds!` : r.mode === 'rocket' ? `Your rocket reached the moon! You collected ${r.okN} of ${r.n} stars.` : `${r.okN} out of ${r.n} right first time.`}</div>`;
  r.extra.forEach(a => h += `<div class="award"><span class="em">${a.em}</span>${a.txt}</div>`);
  if (r.wrong.length && !y1) h += `<div class="mistakes"><div class="section-title">Let's look at these again (they'll come back later too):</div>${r.wrong.map((q, i) => `<div class="mistake" data-act="toggleMistake" data-arg="${i}" id="mk${i}"><div class="mq"><span>${q.text.split(SLOT).join('?')}</span><span class="hl">${q.kind === 'num' ? (q.pre || '') + q.answer + (q.post || '') : esc(answerText(q))} ▾</span></div><ol class="steps">${(q.steps || []).map(s => `<li>${s}</li>`).join('')}</ol></div>`).join('')}</div>`;
  else if (r.wrong.length) h += `<div class="msg">🔁 We'll practise the tricky ones again soon!</div>`;
  h += `<div class="row" style="margin-top:10px"><button class="btn big-btn primary" data-act="again">🔄 ${y1 ? 'Again' : 'Play again'}</button><button class="btn big-btn" data-act="${App.topicId && lastRound && lastRound.tids.length === 1 ? 'toTopic' : 'toHome'}">🏠 ${y1 ? 'Home' : 'Back'}</button></div>`;
  $('resultBody').innerHTML = h; show('result');
}

/* ---- stickers ---- */
function renderStickers() {
  const got = App.prog.stickers; $('stkCount').textContent = `${got.length} / ${STICKERS.length}`;
  $('stickerGrid').innerHTML = STICKERS.map(s => got.includes(s) ? `<div class="stk">${s}</div>` : `<div class="stk no">?</div>`).join('');
  show('stickers');
}

/* ---- parental gate ---- */
let gate = null;
function openGate() {
  const a = rnd(13, 19), b = rnd(6, 9); gate = { ans: a * b, input: '' };
  $('modalBox').innerHTML = `<h2>🔒 Grown-ups only</h2><p>What is ${a} × ${b}?</p><div class="slotline" style="margin-bottom:12px"><span class="slot" id="gateSlot"></span></div>
   <div class="numpad" style="margin:0 auto 14px;justify-content:center">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="btn" data-act="gkey" data-arg="${n}">${n}</button>`).join('')}<button class="btn" data-act="gkey" data-arg="del">⌫</button><button class="btn" data-act="gkey" data-arg="0">0</button><button class="btn go" data-act="gkey" data-arg="go">✓</button></div>
   <button class="btn" data-act="closeModal">Cancel</button>`;
  $('modal').classList.add('show');
}
function gateKey(k) {
  if (k === 'go') { if (Number(gate.input) === gate.ans) { closeModal(); renderParent(); } else { $('modalBox').querySelector('p').textContent = 'Not quite — try this one:'; const a = rnd(13, 19), b = rnd(6, 9); gate = { ans: a * b, input: '' }; setTimeout(() => { const p = $('modalBox').querySelector('p'); if (p) p.textContent = `What is ${a} × ${b}?`; $('gateSlot').textContent = ''; }, 900); } return; }
  if (k === 'del') gate.input = gate.input.slice(0, -1); else if (gate.input.length < 4) gate.input += k;
  $('gateSlot').textContent = gate.input;
}
function closeModal() { $('modal').classList.remove('show'); }
function askQuit() {
  $('modalBox').innerHTML = `<h2>${App.year === 1 ? 'Stop playing?' : 'Stop this round?'}</h2><p>${App.year === 1 ? '' : 'Your answers so far are saved.'}</p><div class="row"><button class="btn big-btn green" data-act="closeModal">▶️ Keep going</button><button class="btn big-btn" data-act="quit">⏹ Stop</button></div>`;
  $('modal').classList.add('show');
}

/* ---- parent area ---- */
let resetArm = null;
function fmtTime(s) { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; }
function renderParent() {
  saveProg();
  let h = '';
  settings.profiles.forEach(p => {
    const pr = p.id === App.pid ? App.prog : loadProg(p.id), tops = topicsFor(p.year);
    const tot = tops.reduce((a, t) => a + ((pr.topics[t.id] || {}).att || 0), 0), okT = tops.reduce((a, t) => a + ((pr.topics[t.id] || {}).ok || 0), 0);
    const rows = tops.map(t => {
      const st = pr.topics[t.id] || { att: 0, ok: 0, level: 1, max: 1, done: {} }, acc = st.att ? Math.round(st.ok / st.att * 100) : null, weak = st.att >= 5 && acc < 70;
      const col = acc == null ? '#ddd' : acc >= 85 ? '#22a861' : acc >= 70 ? '#ffc93c' : '#ff6b6b';
      return `<tr><td>${t.icon} ${t.name}${weak ? ' <span class="weak">• needs practice</span>' : ''}</td><td>${st.att}</td><td><div class="bar"><i style="width:${acc || 0}%;background:${col}"></i></div></td><td>${acc == null ? '–' : acc + '%'}</td><td>${Math.min(st.level, st.max)} / ${t.levels.length}</td></tr>`;
    }).join('');
    const weakList = tops.map(t => ({ t, st: pr.topics[t.id] })).filter(x => x.st && x.st.att >= 5 && x.st.ok / x.st.att < .7).sort((a, b) => a.st.ok / a.st.att - b.st.ok / b.st.att);
    const recent = (pr.wrongLog || []).filter(w => tops.some(t => t.id === w.tid)).slice(0, 6);
    h += `<div class="pcard"><h2>${p.avatar} ${esc(p.name)} <span class="note">Year ${p.year}</span></h2>
      <div class="kv"><span>⏱ Time played: ${fmtTime(pr.time || 0)}</span><span>❓ Questions: ${tot}</span><span>🎯 Accuracy: ${tot ? Math.round(okT / tot * 100) + '%' : '–'}</span><span>⭐ Stars: ${pr.stars}</span><span>📒 Stickers: ${pr.stickers.length}</span><span>🔁 Tricky questions waiting: ${pr.review.length}</span></div>
      <p style="font-size:19px;font-weight:800;margin:6px 0">${weakList.length ? '⚠️ Weak areas: ' + weakList.map(x => x.t.name).join(', ') : (tot ? '✅ No weak areas yet (needs 5+ answers per topic to judge).' : 'No questions answered yet.')}</p>
      <table class="stats"><tr><th>Topic</th><th>Answered</th><th>Accuracy</th><th></th><th>Level</th></tr>${rows}</table>
      ${recent.length ? `<p class="note" style="margin-top:12px">Recent mistakes:</p><ul style="font-size:17px;margin:4px 0 0">${recent.map(w => `<li>${esc(w.q)} → <b>${esc(w.a)}</b></li>`).join('')}</ul>` : ''}
      <div class="row" style="justify-content:flex-start;margin-top:14px">
        <label style="font-size:19px;font-weight:800">Name <input type="text" maxlength="16" value="${esc(p.name)}" data-name="${p.id}"></label>
        <div class="seg">${[1, 3].map(y => `<button class="${p.year === y ? 'on' : ''}" data-act="setYear" data-arg="${p.id}|${y}">Year ${y}</button>`).join('')}</div>
        <div class="seg"><button class="${settings.autoRead[p.id] ? 'on' : ''}" data-act="autoRead" data-arg="${p.id}">🔈 Auto read-aloud ${settings.autoRead[p.id] ? 'on' : 'off'}</button></div>
        <button class="btn" style="background:#ffe3e3" data-act="reset" data-arg="${p.id}">${resetArm === p.id ? '⚠️ Tap again to reset' : '🗑 Reset progress'}</button>
      </div></div>`;
  });
  h += `<div class="pcard"><h2>ℹ️ About</h2><p class="note">Progress is saved only on this iPad (no accounts, no internet, no tracking). ${Store.ok ? 'Saving is working.' : '<b>Saving is not available in this browser mode, so progress will be lost when the app closes.</b>'}<br>Questions follow the National Curriculum for England (2014). Each round: Year 1 = 5 questions, Year 3 = 10. Three right in a row moves up a level; two wrong in a row moves down. Missed questions come back after 3, 8 and 20 more questions.<br>Changing a child's year shows that year's topics; progress for each year is kept separately.</p></div>`;
  $('parentBody').innerHTML = h; show('parent');
  $('parentBody').querySelectorAll('input[data-name]').forEach(inp => inp.addEventListener('change', () => { const p = profile(inp.dataset.name); p.name = inp.value.trim().slice(0, 16) || p.name; saveSettings(); }));
}

/* ---- actions (all taps go through here) ---- */
const ACT = {
  pick: id => pickProfile(id),
  toStart: () => { stopSession(); saveProg(); renderStart(); },
  toHome: () => { stopSession(); renderHome(); },
  toTopic: () => { stopSession(); App.topicId ? renderTopic(App.topicId) : renderHome(); },
  topic: id => renderTopic(id),
  learn: id => startLesson(id),
  lessonNext: () => { if (lessonIdx < lessonSlides.length - 1) { lessonIdx++; renderSlide(); } else { lastRound = { mode: 'learn', tids: [App.topicId] }; startSession('learn', [App.topicId]); } },
  lessonPrev: () => { if (lessonIdx > 0) { lessonIdx--; renderSlide(); } },
  sayLesson: () => Speech.say(lessonSlides[lessonIdx].say),
  practise: arg => { const [tid, l] = arg.split('|'); App.topicId = tid; lastRound = { mode: 'practice', tids: [tid], lvl: +l }; startSession('practice', [tid], +l); },
  locked: () => toast(App.year === 1 ? '🔒 Finish the level before first!' : '🔒 Get 2 or more stars on the level before to unlock this one.'),
  game: arg => { const [g, t] = arg.split('|'); const tids = t === 'mix' ? topicsFor(App.year).map(x => x.id) : [t]; if (t === 'mix') App.topicId = null; else App.topicId = t; lastRound = { mode: g, tids }; startSession(g, tids); },
  review: () => { lastRound = { mode: 'review', tids: topicsFor(App.year).map(x => x.id) }; App.topicId = null; startSession('review', lastRound.tids); },
  again: () => { if (!lastRound) return renderHome(); if (lastRound.mode === 'review' && !App.prog.review.length) return renderHome(); startSession(lastRound.mode, lastRound.tids, lastRound.lvl); },
  key: k => pressKey(k),
  choose: (k, b) => submit(k, b),
  hint: () => showHint(),
  sayQ: () => sayQuestion(),
  sayExplain: () => sayExplain(),
  nextQ: () => { Speech.stop(); S.idx++; nextQuestion(); },
  quitAsk: () => askQuit(),
  quit: () => { closeModal(); stopSession(); S = null; App.topicId ? renderTopic(App.topicId) : renderHome(); },
  closeModal: () => closeModal(),
  stickers: () => renderStickers(),
  toggleMistake: i => $('mk' + i).classList.toggle('open'),
  gate: () => openGate(),
  gkey: k => gateKey(k),
  mute: () => { settings.muted = !settings.muted; saveSettings(); updateMute(); },
  setYear: arg => { const [id, y] = arg.split('|'); profile(id).year = +y; saveSettings(); renderParent(); },
  autoRead: id => { settings.autoRead[id] = !settings.autoRead[id]; saveSettings(); renderParent(); },
  reset: id => {
    if (resetArm !== id) { resetArm = id; renderParent(); setTimeout(() => { if (resetArm === id) { resetArm = null; if (App.screen === 'parent') renderParent(); } }, 4000); return; }
    resetArm = null; Store.del('mq.prog.' + id); if (App.pid === id) App.prog = newProg(); renderParent(); toast('Progress reset');
  }
};
const SILENT = new Set(['key', 'choose', 'gkey']);

/* =========================================================
   Boot
   ========================================================= */
function boot() {
  Store.init();
  const saved = Store.get('mq.settings', null);
  if (saved && saved.profiles) settings = Object.assign(settings, saved);
  updateMute();
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    Sound.init(); const act = b.dataset.act; if (!SILENT.has(act)) Sound.play('tap');
    try { ACT[act] && ACT[act](b.dataset.arg, b); } catch (err) { console.error(err); }
  });
  // stop pinch / double-tap zoom and long-press menus during play
  ['gesturestart', 'gesturechange', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  document.addEventListener('contextmenu', e => { if (!e.target.closest('input')) e.preventDefault(); });
  let lastEnd = 0;
  document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastEnd < 350 && !e.target.closest('input')) e.preventDefault(); lastEnd = now; }, { passive: false });
  document.addEventListener('pointerdown', () => { App.lastTouch = Date.now(); }, { passive: true });
  // time played: counts while a child is active and has touched the screen in the last 90 s
  setInterval(() => {
    if (App.pid && App.prog && document.visibilityState === 'visible' && Date.now() - App.lastTouch < 90000 && App.screen !== 'start' && App.screen !== 'parent') {
      App.prog.time = (App.prog.time || 0) + 1; if (App.prog.time % 15 === 0) saveProg();
    }
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') saveProg(); });
  if (Speech.ok) { Speech.pick(); try { speechSynthesis.onvoiceschanged = () => Speech.pick(); } catch (e) { } }
  makeTouchIcon();
  // Optional offline cache: only if sw.js sits next to this file on a web server.
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').then(() => { if (window.caches) caches.open('maths-quest-v1').then(c => c.add(location.href.split('#')[0])).catch(() => { }); }).catch(() => { });
  }
  renderStart();
}
function makeTouchIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#f0507f'); g.addColorStop(1, '#6c4cf0'); x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#fff'; x.font = 'bold 64px "Arial Rounded MT Bold",Arial,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('1+2', 90, 70);
    x.font = '56px sans-serif'; x.fillText('⭐', 90, 132);
    $('touchIcon').href = c.toDataURL('image/png');
  } catch (e) { }
}
if (typeof window !== 'undefined' && typeof document !== 'undefined' && document.getElementById('app')) boot();

</script>
